<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Scan Shelf QR</title>

  <style>
    * {
      box-sizing: border-box;
    }

    [hidden] {
      display: none !important;
    }

    body {
      margin: 0;
      padding: 24px 16px;
      background: #f5f8f9;
      color: #172b36;
      font: 18px/1.45 Arial, sans-serif;
    }

    main {
      max-width: 520px;
      margin: auto;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    p {
      color: #60717b;
    }

    #reader {
      width: 100%;
      margin: 18px 0;
      overflow: hidden;
      border-radius: 14px;
      background: white;
    }

    #reader video {
      display: block !important;
      width: 100% !important;
      height: auto !important;
    }

    button,
    .back {
      display: block;
      width: 100%;
      min-height: 56px;
      padding: 16px;
      border: 0;
      border-radius: 12px;
      font: inherit;
      font-weight: bold;
      text-align: center;
      text-decoration: none;
    }

    button {
      background: #126b50;
      color: white;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    .back {
      margin-top: 16px;
      border: 1px solid #dbe4e8;
      background: white;
      color: #126b50;
    }

    #status {
      min-height: 54px;
      overflow-wrap: anywhere;
    }

    .version {
      margin-top: 20px;
      font-size: 12px;
      text-align: center;
      color: #7b8b94;
    }
  </style>
</head>

<body>
  <main>
    <h1>Scan Shelf QR</h1>
    <p>Point the camera at the shelf QR code.</p>

    <div id="reader"></div>

    <p id="status" aria-live="polite">
      Opening camera…
    </p>

    <button id="start" type="button">
      Restart camera
    </button>

    <a id="back" class="back">
      Back to lookup
    </a>

    <p class="version">
      Scanner version: 2026-10-05.3
    </p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<script>
  const LOOKUP_URL =
    'https://script.google.com/macros/s/AKfycbxyHlRba23KwsR8MAxhaksO0IG_pso2YxzZpaCcNLQajK1gd8M9SrRYnMGVOvh065fm_g/exec';

  const button = document.getElementById('start');
  const status = document.getElementById('status');
  const reader = document.getElementById('reader');
  const backLink = document.getElementById('back');

  backLink.href = LOOKUP_URL;

  let scanner = null;
  let starting = false;
  let detected = false;
  let leaving = false;

  function releaseTracks() {
    reader.querySelectorAll('video').forEach(function (video) {
      const stream = video.srcObject;

      if (stream && stream.getTracks) {
        stream.getTracks().forEach(function (track) {
          track.stop();
        });
      }
    });
  }

  async function stopCamera() {
    const previous = scanner;
    scanner = null;

    if (previous) {
      try {
        if (previous.isScanning) {
          await previous.stop();
        }
      } catch (error) {
        // Release remaining tracks below.
      }
    }

    releaseTracks();

    if (previous) {
      try {
        previous.clear();
      } catch (error) {
        // Reset the reader below.
      }
    }

    reader.innerHTML = '';
  }

  async function openCamera() {
    if (starting || detected || leaving) return;

    starting = true;
    button.disabled = true;
    status.textContent = 'Opening camera…';

    try {
      await stopCamera();

      if (typeof Html5Qrcode === 'undefined') {
        throw new Error(
          'Scanner library did not load. Refresh the page.'
        );
      }

      scanner = new Html5Qrcode('reader', {
        formatsToSupport: [
          Html5QrcodeSupportedFormats.QR_CODE
        ],
        verbose: false
      });

      await scanner.start(
        { facingMode: 'environment' },
        {
          fps: 10,
          qrbox: function (width, height) {
            const size = Math.floor(
              Math.min(width, height) * 0.7
            );

            return { width: size, height: size };
          }
        },
        onQrDetected,
        function () {
          // Continue scanning.
        }
      );

      if (leaving) {
        await stopCamera();
        return;
      }

      const video = reader.querySelector('video');

      if (video) {
        video.muted = true;
        video.setAttribute('playsinline', '');

        await video.play();
      }

      if (!detected) {
        status.textContent =
          'Hold the QR code steady inside the frame.';
      }
    } catch (error) {
      await stopCamera();

      if (!leaving && !detected) {
        status.textContent =
          'Camera error: ' +
          String(error && error.message ? error.message : error);
      }
    } finally {
      starting = false;
      button.disabled = detected;
      button.hidden = false;
      button.textContent = 'Restart camera';
    }
  }

  async function onQrDetected(text) {
    if (detected || leaving) return;

    const code = String(text).trim().toUpperCase();
    if (!code) return;

    detected = true;
    button.disabled = true;
    status.textContent =
      'Found ' + code + '. Opening result…';

    // Wait for startup to finish before stopping the scanner.
    while (starting) {
      await new Promise(function (resolve) {
        setTimeout(resolve, 50);
      });
    }

    await stopCamera();

    const destination = new URL(LOOKUP_URL);
    destination.searchParams.set('itemCode', code);

    window.location.replace(destination.toString());
  }

  button.addEventListener('click', openCamera);

  backLink.addEventListener('click', function () {
    leaving = true;
    releaseTracks();
  });

  window.addEventListener('pagehide', function () {
    leaving = true;
    releaseTracks();
  });

  window.addEventListener('pageshow', function (event) {
    leaving = false;

    if (event.persisted) {
      // Reload if Chrome restores a previously stopped camera page.
      window.location.reload();
      return;
    }

    openCamera();
  });

  // No visibilitychange handler:
  // temporary visibility changes must not interrupt startup.
</script>
</body>
</html>
